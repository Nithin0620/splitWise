name: Release APK

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  ANDROID_KEYSTORE_FILE: ${{ github.workspace }}/mobile/android/app/release.keystore
  ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
  ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
  ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
          accept-android-sdk-licenses: true

      - name: Install dependencies
        working-directory: mobile
        run: npm ci

      - name: Apply version from tag
        working-directory: mobile
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          node -e "
            const fs = require('fs');
            const app = JSON.parse(fs.readFileSync('app.json', 'utf8'));
            app.expo.version = '${VERSION}';
            app.expo.android.versionCode = ${GITHUB_RUN_NUMBER};
            fs.writeFileSync('app.json', JSON.stringify(app, null, 2) + '\n');
          "

      - name: Generate native Android project
        working-directory: mobile
        env:
          CI: '1'
          EXPO_NO_GIT_STATUS: '1'
        run: npx expo prebuild --platform android --clean --no-install

      - name: Decode release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "ANDROID_KEYSTORE_BASE64 is not set; skipping release keystore."
            exit 0
          fi
          python3 - <<'PY'
          import base64, os, sys

          raw = os.environ["ANDROID_KEYSTORE_BASE64"]
          clean = "".join(raw.split()).strip("'\"`").replace("-", "+").replace("_", "/")
          clean += "=" * (-len(clean) % 4)

          allowed = set("ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789+/=")
          bad = sorted({c for c in clean if c not in allowed})
          if bad:
              print(f"::error::ANDROID_KEYSTORE_BASE64 contains invalid characters: {bad!r}")
              print("::error::Re-create the secret with: base64 -w0 release.keystore  (macOS: base64 -i release.keystore)")
              sys.exit(1)

          try:
              data = base64.b64decode(clean, validate=True)
          except Exception as exc:
              print(f"::error::ANDROID_KEYSTORE_BASE64 is not valid base64: {exc}")
              sys.exit(1)

          if len(data) < 100:
              print(f"::error::Decoded keystore is only {len(data)} bytes; the secret is truncated or wrong.")
              sys.exit(1)

          path = "mobile/android/app/release.keystore"
          with open(path, "wb") as fh:
              fh.write(data)
          print(f"Decoded keystore ({len(data)} bytes).")
          PY

      - name: Verify release keystore
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          if [ ! -f mobile/android/app/release.keystore ]; then
            echo "No release keystore; using default signing."
            exit 0
          fi
          keytool -list -keystore mobile/android/app/release.keystore \
            -storepass "$ANDROID_KEYSTORE_PASSWORD" -alias "$ANDROID_KEY_ALIAS" >/dev/null
          echo "Keystore is valid and alias '$ANDROID_KEY_ALIAS' exists."

      - name: Configure release signing
        working-directory: mobile
        run: node "$GITHUB_WORKSPACE/.github/scripts/configure-android-signing.js"

      - name: Build release APK
        working-directory: mobile/android
        run: ./gradlew assembleRelease --no-daemon

      - name: Collect APK
        run: cp mobile/android/app/build/outputs/apk/release/app-release.apk splitwise.apk

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: splitwise.apk
          generate_release_notes: true
          fail_on_unmatched_files: true
